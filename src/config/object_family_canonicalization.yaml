# ============================================================
# 4. 跨源模式定义
# ============================================================
cross_source_patterns:
  # 模式 A: news + paper (学术-媒体联动)
  news_paper:
    sources: ["news", "paper"]
    description: "学术-媒体联动，通常表示研究热点正在扩散"
    weight: 1.0
    patent_role: "optional"  # 专利可选

  # 模式 B: paper + patent (学术-工程联动)
  paper_patent:
    sources: ["paper", "patent"]
    description: "学术-工程联动，通常表示技术正在走向应用"
    weight: 1.2
    patent_role: "engineering_signal"  # 专利承担工程信号

  # 模式 C: news + patent (媒体-工程联动)
  news_patent:
    sources: ["news", "patent"]
    description: "媒体-工程联动，通常表示产业应用已有进展"
    weight: 1.1
    patent_role: "application_trace"  # 专利承担应用痕迹

  # 模式 D: news + paper + patent (全源验证)
  full_cross_source:
    sources: ["news", "paper", "patent"]
    description: "全源验证，技术成熟度较高"
    weight: 1.5
    patent_role: "validation"  # 专利承担验证角色

# ============================================================
# 5. 专利侧角色定义
# ============================================================
patent_roles:
  engineering_signal:
    description: "工程信号补充"
    expectation: "专利侧不需要与 news/paper 在主题表述上完全一致"
    focus: "技术实现细节、工程参数、应用场景"

  application_trace:
    description: "应用痕迹补充"
    expectation: "专利侧提供产业化证据"
    focus: "产品化、商业化、落地场景"

  validation:
    description: "验证角色"
    expectation: "专利侧提供技术成熟度证据"
    focus: "技术路线稳定性、市场认可度"

  optional:
    description: "可选补充"
    expectation: "专利侧不强制要求"
    focus: "任何补充信息"

