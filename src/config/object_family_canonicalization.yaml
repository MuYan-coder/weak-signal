      - "li-dar"

  # SLAM
  "slam":
    canonical: "slam"
    variants:
      - "simultaneous localization and mapping"
      - "slam system"

  # 模拟
  "simulation":
    canonical: "simulation"
    variants:
      - "simulations"
      - "simulator"
      - "simulators"

  # 具身智能仿真（simulation 拆分）
  "embodied simulation":
    canonical: "embodied simulation"
    variants:
      - "embodied sim"
      - "embodied intelligence simulation"
      - "具身智能仿真"

  # 机器人训练（simulation 拆分）
