  valid_candidate_patterns:
    - pattern_id: humanoid_object_mechanism_task
      description: "机器人对象、机制和任务或性能目标同时出现。"
      required_slots:
        - technical_object
        - mechanism
      optional_slots:
        - task
        - performance
        - data_modality
        - scene
        - evidence_span
      min_required_slot_count: 2
      evidence_required: true
      weight: 1.0
      reason_template: "候选包含机器人对象、机制和任务约束，且有证据片段支撑。"
