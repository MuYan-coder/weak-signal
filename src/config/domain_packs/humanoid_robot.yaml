canonicalization:
  object_families:
    - family_id: of_robot_training
      canonical_term: robot training
      aliases:
        - robot training
        - robotic training
        - 机器人训练
      term_type: method
      merge_confidence: 0.8
      evidence_required: true
    - family_id: of_robot_planning
      canonical_term: robot planning
      aliases:
        - robot planning
        - robotic planning
        - 机器人规划
      term_type: task
      merge_confidence: 0.8
      evidence_required: true
    - family_id: of_embodied_simulation
      canonical_term: embodied simulation
      aliases:
        - embodied simulation
        - robot simulation
        - 具身仿真
        - 机器人仿真
      term_type: method
      merge_confidence: 0.8
      evidence_required: true
  alias_groups:
    - canonical: humanoid robot
      aliases:
        - 人形机器人
        - 人型机器人
        - 仿人机器人
        - humanoid
      do_not_merge_with:
        - industrial robot
    - canonical: dexterous hand
      aliases:
        - 灵巧手
        - dexterous hand
        - multi-finger hand
      do_not_merge_with: []
  parent_child_terms:
    - parent: humanoid robot
      children:
        - dexterous hand
        - manipulator
        - gripper
        - actuator
        - sensor
  do_not_merge_rules:
    - rule_id: humanoid_vs_generic_ai
      left_terms:
        - humanoid robot
        - 人形机器人
      right_terms:
        - generic ai
        - chatbot
      reason: "通用 AI 应用不等同于人形机器人对象。"
  object_family_enabled: true
evidence_rules:
  strong_evidence_patterns:
    - pattern_id: humanoid_cross_source_evidence
      required_fields:
        - source_type
        - title
        - evidence_span
      match_terms:
        - robot
        - 机器人
        - humanoid
        - 人形机器人
      min_source_types: 2
      reason_template: "多来源证据均命中机器人对象或任务。"
  weak_evidence_patterns:
    - pattern_id: humanoid_scope_echo_only
      match_terms:
        - robot
        - 机器人
        - world model
        - 世界模型
      rejection_if_only_signal: true
      reason_template: "仅出现领域回声词，缺少具体技术对象或机制。"
  source_reliability_hints:
    - paper
    - patent
    - report
    - news
  traceability_fields:
    - title
    - text
    - evidence_span
    - source_type
    - date
    - url
  evidence_rejection_patterns:
    - 招聘
    - 广告
reporting:
  display_labels:
    domain: 人形机器人
    main_scope: 人形机器人
    weak_signal: 弱信号
    near_strong: 近强信号
  explanation_templates:
