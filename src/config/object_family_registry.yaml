# ============================================================
# 跨源模式定义（参考）
# ============================================================
cross_source_patterns:
  news_paper:
    sources: ["news", "paper"]
    description: "学术-媒体联动，通常表示研究热点正在扩散"
    strength: "medium"
    reason: "研究+传播"

  paper_patent:
    sources: ["paper", "patent"]
    description: "学术-工程联动，通常表示技术正在走向应用"
    strength: "medium"
    reason: "研究+工程"

  news_patent:
    sources: ["news", "patent"]
    description: "媒体-工程联动，通常表示产业应用已有进展"
    strength: "medium"
    reason: "传播+应用痕迹"

  full_cross_source:
    sources: ["news", "paper", "patent"]
    description: "全源验证，技术成熟度较高"
    strength: "strong"
    reason: "强验证"

# ============================================================
# 专利侧角色定义（参考）
# ============================================================
patent_roles:
  engineering_signal:
    description: "工程信号补充"
    expectation: "专利侧不需要与 news/paper 在主题表述上完全一致"
    focus: "技术实现细节、工程参数、应用场景"

  application_trace:
    description: "应用痕迹补充"
    expectation: "专利侧提供产业化证据"
    focus: "产品化、商业化、落地场景"

  validation:
    description: "验证角色"
    expectation: "专利侧提供技术成熟度证据"
    focus: "技术路线稳定性、市场认可度"

  optional:
    description: "可选补充"
    expectation: "专利侧不强制要求"
    focus: "任何补充信息"
