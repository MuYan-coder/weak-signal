# Object Family Registry
# 对象族注册表 - 26 个细粒度跨源技术术语的正式定义
#
# 每个对象族包含：
# - family_id: 唯一标识符
# - canonical_term: 对象族内部统一术语
# - alias_terms: 别名列表
# - zh_en_pairs: 中英文对照
# - parent_term: 上位概念
# - term_type: 术语类型 (model_name | task | capability | component | scenario | method)
# - cross_source_pattern: 跨源模式
# - patent_role: 专利侧角色
# - priority: 优先级 (high | medium | low)
# - description: 描述

# ============================================================
# 术语类型定义
# ============================================================
# model_name: 模型名称 (如 v-jepa, dreamer, gaia-1)
# task: 任务类型 (如 navigation, manipulation, planning)
# capability: 能力类型 (如 perception, reasoning, control)
# component: 硬件/软件组件 (如 lidar, camera, imu)
# scenario: 应用场景 (如 indoor, outdoor, driving)
# method: 方法类型 (如 reinforcement learning, simulation)

# ============================================================
# 跨源模式定义
# ============================================================
# news_paper: 学术-媒体联动，研究热点正在扩散
# paper_patent: 学术-工程联动，技术正在走向应用
# news_patent: 媒体-工程联动，产业应用已有进展
# full_cross_source: 全源验证，技术成熟度较高

# ============================================================
# 专利侧角色定义
# ============================================================
# engineering_signal: 工程信号补充，专利侧不需要与 news/paper 在主题表述上完全一致
# application_trace: 应用痕迹补充，专利侧提供产业化证据
# validation: 验证角色，专利侧提供技术成熟度证据
# optional: 可选补充，专利侧不强制要求

